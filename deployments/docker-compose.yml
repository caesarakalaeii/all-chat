version: '3.9'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: allchat-postgres
    environment:
      POSTGRES_DB: allchat
      POSTGRES_USER: allchat
      POSTGRES_PASSWORD: allchat_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allchat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allchat

  # Redis cache and message broker
  redis:
    image: redis:7-alpine
    container_name: allchat-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - allchat

  # Auth Service (Phase 1)
  auth-service:
    build:
      context: ../
      dockerfile: services/auth-service/Dockerfile
    container_name: allchat-auth
    environment:
      PORT: "8081"
      LOG_LEVEL: "info"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: allchat_dev_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      JWT_EXPIRY_HOURS: "24"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - allchat
    restart: unless-stopped

  # Overlay Manager (Phase 1)
  overlay-manager:
    build:
      context: ../
      dockerfile: services/overlay-manager/Dockerfile
    container_name: allchat-overlay
    environment:
      PORT: "8082"
      LOG_LEVEL: "info"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: allchat_dev_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:8081
      MESSAGE_PROCESSOR_URL: http://message-processor:8087
      MESSAGE_PROCESSOR_API_KEY: ${MESSAGE_PROCESSOR_API_KEY:-dev-mock-key}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - allchat
    restart: unless-stopped

  # Emote Service (Phase 2)
  emote-service:
    build:
      context: ../
      dockerfile: services/emote-service/Dockerfile
    container_name: allchat-emote
    environment:
      PORT: "8083"
      LOG_LEVEL: "info"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - allchat
    restart: unless-stopped

  # API Gateway (Phase 2 + Phase 3 WebSocket)
  api-gateway:
    build:
      context: ../
      dockerfile: services/api-gateway/Dockerfile
    container_name: allchat-gateway
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      AUTH_SERVICE_URL: http://auth-service:8081
      OVERLAY_SERVICE_URL: http://overlay-manager:8082
      EMOTE_SERVICE_URL: http://emote-service:8083
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: allchat_dev_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      overlay-manager:
        condition: service_started
      emote-service:
        condition: service_started
    networks:
      - allchat
    restart: unless-stopped

  # Twitch Listener (Phase 3)
  twitch-listener:
    build:
      context: ../
      dockerfile: services/twitch-listener/Dockerfile
    container_name: allchat-twitch-listener
    environment:
      PORT: "8085"
      LOG_LEVEL: "info"
      TWITCH_BOT_USERNAME: ${TWITCH_BOT_USERNAME}
      TWITCH_BOT_OAUTH: ${TWITCH_BOT_OAUTH}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: allchat_dev_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SOURCE_MANAGER_URL: http://source-manager:8088
      SOURCE_MANAGER_SECRET: ${SERVICE_JWT_SECRET:-dev-service-secret}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - allchat
    restart: unless-stopped

  # Message Processor (Phase 3)
  message-processor:
    build:
      context: ../
      dockerfile: services/message-processor/Dockerfile
    container_name: allchat-message-processor
    environment:
      PORT: "8087"
      LOG_LEVEL: "info"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: allchat_dev_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EMOTE_SERVICE_URL: http://emote-service:8083
      MOCK_MESSAGE_API_KEY: ${MESSAGE_PROCESSOR_API_KEY:-dev-mock-key}
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emote-service:
        condition: service_started
    networks:
      - allchat
    restart: unless-stopped

  # Source Manager (Phase 4)
  source-manager:
    build:
      context: ../
      dockerfile: services/source-manager/Dockerfile
    container_name: allchat-source-manager
    environment:
      PORT: "8088"
      LOG_LEVEL: "info"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: allchat_dev_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-service-secret}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - allchat
    restart: unless-stopped

  # YouTube Listener (Phase 4)
  youtube-listener:
    build:
      context: ../
      dockerfile: services/youtube-listener/Dockerfile
    container_name: allchat-youtube-listener
    environment:
      PORT: "8086"
      LOG_LEVEL: "info"
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: allchat_dev_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      POLLING_INTERVAL_MS: "2000"
      QUOTA_LIMIT_DAILY: "10000"
      SOURCE_MANAGER_URL: http://source-manager:8088
      SOURCE_MANAGER_SECRET: ${SERVICE_JWT_SECRET:-dev-service-secret}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      source-manager:
        condition: service_started
    networks:
      - allchat
    restart: unless-stopped

  # Frontend (Phase 5)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: allchat-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api-gateway:8080
      NEXT_PUBLIC_WS_URL: ws://api-gateway:8080
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - allchat
    restart: unless-stopped

  # Discord Quota Monitor Bot (Phase 5)
  discord-bot:
    build:
      context: ../services/discord-bot
      dockerfile: Dockerfile
    container_name: allchat-discord-bot
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      YOUTUBE_LISTENER_URL: http://youtube-listener:8086
      STATUS_UPDATE_INTERVAL: "3600000"
    depends_on:
      redis:
        condition: service_healthy
      youtube-listener:
        condition: service_started
    networks:
      - allchat
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  allchat:
    driver: bridge
