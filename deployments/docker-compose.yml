version: '3.9'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: allchat-postgres
    environment:
      POSTGRES_DB: allchat
      POSTGRES_USER: allchat
      POSTGRES_PASSWORD: allchat_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allchat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allchat

  # Redis cache and message broker
  redis:
    image: redis:7-alpine
    container_name: allchat-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - allchat

  # Auth Service (Phase 1)
  auth-service:
    build:
      context: ../
      dockerfile: services/auth-service/Dockerfile
    container_name: allchat-auth
    environment:
      PORT: "8081"
      LOG_LEVEL: "info"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: allchat_dev_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      TWITCH_REDIRECT_URL: ${TWITCH_REDIRECT_URL:-http://localhost:8080/api/v1/auth/callback}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRY_HOURS: "24"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - allchat
    restart: unless-stopped

  # Overlay Manager (Phase 1)
  overlay-manager:
    build:
      context: ../services/overlay-manager
      dockerfile: services/overlay-manager/Dockerfile
    container_name: allchat-overlay
    environment:
      PORT: "8082"
      LOG_LEVEL: "info"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: allchat_dev_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - allchat
    restart: unless-stopped

  # Emote Service (Phase 2)
  emote-service:
    build:
      context: ../
      dockerfile: services/emote-service/Dockerfile
    container_name: allchat-emote
    environment:
      PORT: "8083"
      LOG_LEVEL: "info"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - allchat
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  allchat:
    driver: bridge
