apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: all-chat
data:
  ENVIRONMENT: "production"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "allchat"
  DATABASE_SSLMODE: "require"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  CORS_ALLOWED_ORIGINS: "https://your-domain.com"
