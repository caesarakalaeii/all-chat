# cert-manager ClusterIssuer for Let's Encrypt (production).
#
# SECURITY (M14): Provides TLS certificates for the api-gateway Ingress.
#
# PREREQUISITE: cert-manager must be installed in the cluster first.
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.3/cert-manager.yaml
#
# Before applying, replace the email below with a real operations address so
# Let's Encrypt can send expiry/revocation notices.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Replace with a real operations email before applying.
    email: ops@allch.at
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
