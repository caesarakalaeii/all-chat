apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: allchat-warning-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus
spec:
  groups:
    - name: allchat-warnings
      interval: 1m
      rules:
        # YouTube Quota Warning - Early warning at 80%
        - alert: YouTubeQuotaWarning
          expr: listener_quota_usage_percentage{platform="youtube"} > 80
          for: 5m
          labels:
            severity: warning
            team: allchat
            platform: youtube
          annotations:
            summary: "YouTube API quota warning (>80%)"
            description: |
              YouTube API quota usage is at {{ $value | humanizePercentage }} (threshold: 80%).

              Impact: Approaching quota limit, may hit 100% within hours.

              Recommended Actions:
              1. Monitor quota trend in dashboard: /d/allchat-youtube-quota
              2. Plan to reduce polling interval if approaching 90%
              3. Prepare quota increase request
              4. Review stream activity and disable low-priority streams if needed

        # High Processing Latency
        - alert: AllChatHighProcessingLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(processor_message_processing_duration_seconds_bucket[5m])) by (platform, le)
            ) > 0.5
          for: 10m
          labels:
            severity: warning
            team: allchat
          annotations:
            summary: "High message processing latency (p95 > 500ms)"
            description: |
              Message processing p95 latency is {{ $value }}s for {{ $labels.platform }} (threshold: 500ms).

              Impact: Delayed message delivery to overlays.

              Action Required:
              1. Check processor dashboard: /d/allchat-message-pipeline
              2. Review stage durations to identify bottleneck
              3. Check emote cache hit rate
              4. Consider scaling message processors
              5. Review external API latencies (7TV, BTTV, FFZ)

        # Message Stream Backlog
        - alert: AllChatMessageBacklog
          expr: processor_stream_lag > 5000
          for: 5m
          labels:
            severity: warning
            team: allchat
          annotations:
            summary: "High message stream backlog"
            description: |
              Redis stream has {{ $value }} pending messages (threshold: 5000).

              Impact: Increasing message delay, potential memory pressure.

              Action Required:
              1. Check processor performance: kubectl top pods -n allchat -l app=message-processor
              2. Scale processors: kubectl scale -n allchat deployment/message-processor --replicas=5
              3. Monitor backlog reduction in dashboard
              4. Check for stuck messages or processing errors

        # Listener Reconnection Loop
        - alert: AllChatListenerReconnecting
          expr: rate(listener_connection_attempts_total{result="failure"}[5m]) > 0.1
          for: 10m
          labels:
            severity: warning
            team: allchat
          annotations:
            summary: "{{ $labels.platform }} listener reconnecting frequently"
            description: |
              {{ $labels.platform }} listener is reconnecting at {{ $value }} failures/sec.

              Impact: Potential message loss, unstable connection.

              Action Required:
              1. Check listener logs for connection errors
              2. Verify platform API status
              3. Check network connectivity
              4. Review authentication credentials

        # High Stream Errors
        - alert: AllChatHighStreamErrors
          expr: rate(processor_stream_errors_total[5m]) > 1
          for: 5m
          labels:
            severity: warning
            team: allchat
          annotations:
            summary: "High Redis stream consumption errors"
            description: |
              Message processor is encountering {{ $value }} stream errors/sec.

              Impact: Messages may be lost or stuck.

              Action Required:
              1. Check processor logs: kubectl logs -n allchat -l app=message-processor
              2. Verify Redis connectivity
              3. Check consumer group health
              4. Review message format issues

        # Pod Crash Loop
        - alert: AllChatPodCrashLoop
          expr: rate(kube_pod_container_status_restarts_total{namespace="allchat"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
            team: allchat
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: |
              Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes.

              Impact: Service instability, potential data loss.

              Action Required:
              1. Check pod logs: kubectl logs -n allchat {{ $labels.pod }} --previous
              2. Check pod events: kubectl describe pod -n allchat {{ $labels.pod }}
              3. Review resource limits and requests
              4. Check for OOM kills or startup failures

        # Emote Cache Miss Rate High
        - alert: AllChatLowEmoteCacheHitRate
          expr: |
            (
              sum(rate(processor_emote_cache_operations_total{operation="hit"}[10m]))
              /
              sum(rate(processor_emote_cache_operations_total[10m]))
            ) < 0.8
          for: 15m
          labels:
            severity: warning
            team: allchat
          annotations:
            summary: "Low emote cache hit rate (<80%)"
            description: |
              Emote cache hit rate is {{ $value | humanizePercentage }} (threshold: 80%).

              Impact: Increased latency from external emote API calls.

              Action Required:
              1. Check emote cache size and TTL settings
              2. Review popular emotes not being cached
              3. Consider increasing cache size
              4. Monitor 7TV/BTTV/FFZ API response times

        # Shard Rebalancing Thrashing - Too many rebalances
        - alert: ShardRebalancingThrashing
          expr: increase(shard_rebalancing_total[30m]) > 5
          for: 5m
          labels:
            severity: warning
            team: allchat
          annotations:
            summary: "Rebalancing thrashing detected ({{ $value }} rebalances in 30min)"
            description: |
              More than 5 rebalancing operations occurred in the last 30 minutes.
              This indicates thrashing - repeated rebalancing without achieving stability.

              Impact: Frequent migrations cause connection churn and potential message loss.

              Remediation Steps:
              1. Check rebalancing logs: kubectl logs -n allchat -l app=source-manager | grep "rebalancing"
              2. Review recent migration failures: Check Grafana → Sharding Overview → Migration Events timeline
              3. Verify load calculation accuracy: Check Prometheus for pod message rates
              4. Increase cooldown duration: Set REBALANCING_COOLDOWN=10m (currently 5m)
              5. Check for oscillating load: Review time-series graphs for stable vs fluctuating loads

              Consider temporarily disabling auto-rebalancing if thrashing persists:
              kubectl set env -n allchat deployment/source-manager REBALANCING_ENABLED=false

        # TikTok canary divergence (2026-09-16 transport plan, phase 2):
        # the signer's viewer-tab relay is the canary for the listener's
        # Node-WS primary transport. Any divergence kind firing repeatedly
        # means TikTok is treating the two transports differently — the
        # early signal of handshake session scoring starting to bite.
        - alert: TikTokCanaryDivergence
          expr: increase(tiktok_canary_divergences_total[10m]) > 3
          for: 0m
          labels:
            severity: warning
            team: allchat
          annotations:
            summary: "TikTok canary relay diverging from primary WS transport"
            description: |
              {{ $labels.kind }} divergence fired more than 3 times in 10 minutes
              for a canary room. The viewer-tab relay and the listener's own
              WebSocket are seeing different traffic for the same room.

              Impact: the primary transport may be degraded before it fails
              outright (TikTok session scoring on the WS handshake).

              Remediation Steps:
              1. Compare per-method frame counts in the listener logs:
                 kubectl logs -n allchat -l app=tiktok-listener | grep "canary divergence"
              2. Check whether the affected room's WS is flapping:
                 tiktok_ws_flap_exhausted_total in Prometheus
              3. If only canary rooms diverge, the primary is healthy — watch
                 and do not roll back.

        # TikTok WS flap exhaustion (phase 1): a room that exhausted its
        # fast retries has hit a persistent refusal, not the transient
        # 200-upgrade flap. Sustained exhaustion across rooms means the
        # session-scoring wall the canary exists to watch.
        - alert: TikTokWsFlapExhausted
          expr: increase(tiktok_ws_flap_exhausted_total[15m]) > 5
          for: 0m
          labels:
            severity: warning
            team: allchat
          annotations:
            summary: "TikTok WS connect flaps not clearing after fast retries"
            description: |
              More than 5 connect attempts in 15 minutes exhausted the flap
              retry budget. The "Unexpected server response: 200" refusal is
              persistent, which means handshake session scoring, not a flap.

              Impact: affected rooms are deaf and stuck in normal error
              backoff.

              Remediation Steps:
              1. Identify affected rooms:
                 kubectl logs -n allchat -l app=tiktok-listener | grep "flap did not clear"
              2. Check lane pinning health: tiktok_ws_lane_pins_total{outcome="failed"}
              3. Check the capture breaker: signer_capture_breaker_trips_total
              4. Verify the signer pool can still capture healthy rooms
                 (signer_sign_requests_total{outcome="success"}).

        # TikTok premium fallback promotion (phase 3, ADR-0058): a room
        # switching to the viewer-tab relay means the primary WS tier was
        # refused persistently. This is the breakage canary for the whole
        # self-signed transport: the users we upgrade are the first to
        # feel whatever TikTok changed, and the alert is the signal that
        # delivery for everyone else is at risk.
        - alert: TikTokFallbackPromoted
          expr: increase(tiktok_fallback_promotions_total{outcome="promoted"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
            team: allchat
          annotations:
            summary: "TikTok premium room promoted to fallback relay transport"
            description: |
              Room {{ $labels.username }} exhausted its WS flap retries and was
              promoted to the signer's viewer-tab relay (premium fallback,
              ADR-0058). Delivery continues, but the primary transport has been
              refused persistently for this room.

              Impact: this is the early-warning channel for the transport as a
              whole — the upgraded users are the canary for everyone on the
              primary tier. One promotion is lane noise; several rooms in a
              short window is TikTok tightening handshake scoring.

              Remediation Steps:
              1. Check how many rooms promoted:
                 increase(tiktok_fallback_promotions_total{outcome="promoted"}[1h])
              2. If promotions repeat for the same room after stint end
                 (TIKTOK_FALLBACK_MAX_DURATION_MS, default 6h), the primary
                 tier is not recovering for it — check lane pinning:
                 tiktok_ws_lane_pins_total{outcome="failed"}
              3. Verify the fallback is actually delivering:
                 rate(tiktok_fallback_deliveries_total{outcome="delivered"}[5m]) > 0
              4. If delivery is flat too, the signer tab is dead — check
                 signer_capture_breaker_trips_total and the signer logs.
              5. Sustained multi-room promotion is the signal to investigate
                 the WS handshake (session scoring) before non-premium rooms
                 start going dark.
