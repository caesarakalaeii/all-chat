global:
  resolve_timeout: 5m

# Inhibit lower severity alerts when higher severity is firing
inhibit_rules:
  - equal:
      - namespace
      - alertname
    source_matchers:
      - severity = critical
    target_matchers:
      - severity =~ warning|info

  - equal:
      - namespace
      - alertname
    source_matchers:
      - severity = warning
    target_matchers:
      - severity = info

  - equal:
      - namespace
    source_matchers:
      - alertname = InfoInhibitor
    target_matchers:
      - severity = info

  - target_matchers:
      - alertname = InfoInhibitor

# Route configuration
route:
  group_by:
    - namespace
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'null'

  routes:
    # Watchdog alert (always null)
    - matchers:
        - alertname = "Watchdog"
      receiver: "null"

    # All-Chat Critical Alerts -> Discord + Email
    - matchers:
        - team = "allchat"
        - severity = "critical"
      receiver: allchat-critical
      group_by:
        - alertname
        - platform
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 4h

    # All-Chat Warning Alerts -> Discord only
    - matchers:
        - team = "allchat"
        - severity = "warning"
      receiver: allchat-warnings
      group_by:
        - alertname
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 12h

# Receivers
receivers:
  - name: 'null'

  - name: allchat-critical
    # CONFIGURE: Add your Discord webhook URL here
    # Get from: Discord Server Settings → Integrations → Webhooks
    discord_configs:
      - webhook_url: 'YOUR_DISCORD_WEBHOOK_URL_HERE'
        send_resolved: true
        title: '🚨 [CRITICAL] {{ .GroupLabels.alertname }}'
        message: |
          **Alert**: {{ .GroupLabels.alertname }}
          **Severity**: {{ .CommonLabels.severity }}
          **Platform**: {{ .CommonLabels.platform }}

          {{ range .Alerts }}
          **Summary**: {{ .Annotations.summary }}
          **Description**: {{ .Annotations.description }}
          **Status**: {{ .Status }}
          {{ end }}

    # CONFIGURE: Add your email address
    email_configs:
      - to: 'YOUR_EMAIL_HERE'
        send_resolved: true
        headers:
          Subject: '[All-Chat CRITICAL] {{ .GroupLabels.alertname }}'

  - name: allchat-warnings
    discord_configs:
      - webhook_url: 'YOUR_DISCORD_WEBHOOK_URL_HERE'
        send_resolved: true
        title: '⚠️ [Warning] {{ .GroupLabels.alertname }}'
        message: |
          **Alert**: {{ .GroupLabels.alertname }}
          **Severity**: {{ .CommonLabels.severity }}

          {{ range .Alerts }}
          **Summary**: {{ .Annotations.summary }}
          **Status**: {{ .Status }}
          {{ end }}

templates:
  - /etc/alertmanager/config/*.tmpl
