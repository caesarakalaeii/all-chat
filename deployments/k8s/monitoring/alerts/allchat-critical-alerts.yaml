apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: allchat-critical-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus
spec:
  groups:
    - name: allchat-critical
      interval: 30s
      rules:
        # Service Down - Critical alert when any All-Chat service is unavailable
        - alert: AllChatServiceDown
          expr: up{namespace="allchat"} == 0
          for: 2m
          labels:
            severity: critical
            team: allchat
          annotations:
            summary: "All-Chat service {{ $labels.app }} is down"
            description: |
              Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been reporting down (up=0) for more than 2 minutes.

              Impact: Platform functionality degraded or unavailable.

              Action Required:
              1. Check pod status: kubectl get pods -n allchat -l app={{ $labels.app }}
              2. View pod logs: kubectl logs -n allchat {{ $labels.pod }} --tail=100
              3. Check pod events: kubectl describe pod -n allchat {{ $labels.pod }}

        # YouTube Quota Critical - Prevent API shutdown
        - alert: YouTubeQuotaCritical
          expr: listener_quota_usage_percentage{platform="youtube"} > 90
          for: 1m
          labels:
            severity: critical
            team: allchat
            platform: youtube
          annotations:
            summary: "YouTube API quota critical (>90%)"
            description: |
              YouTube API quota usage is at {{ $value | humanizePercentage }} (threshold: 90%).

              Impact: Risk of YouTube API shutdown within hours.

              Immediate Actions:
              1. Check quota in dashboard: /d/allchat-youtube-quota
              2. Reduce polling interval: kubectl set env -n allchat deployment/youtube-listener POLLING_INTERVAL=15
              3. Contact Google for emergency quota increase
              4. Consider disabling low-activity streams

        # Listener Disconnected - Platform offline
        - alert: AllChatListenerDisconnected
          expr: listener_connection_status == 0
          for: 2m
          labels:
            severity: critical
            team: allchat
          annotations:
            summary: "{{ $labels.platform }} listener disconnected"
            description: |
              The {{ $labels.platform }} listener has been disconnected for more than 2 minutes.

              Impact: No messages from {{ $labels.platform }} are being received.

              Action Required:
              1. Check listener logs: kubectl logs -n allchat -l app={{ $labels.platform }}-listener --tail=100
              2. Verify platform API status
              3. Check authentication tokens/credentials
              4. Restart if needed: kubectl rollout restart -n allchat deployment/{{ $labels.platform }}-listener

        # High Message Drop Rate - Data loss
        - alert: AllChatHighMessageDropRate
          expr: |
            (
              sum(rate(listener_messages_received_total[5m]))
              -
              sum(rate(listener_messages_published_total{result="success"}[5m]))
            ) / sum(rate(listener_messages_received_total[5m])) * 100 > 5
          for: 5m
          labels:
            severity: critical
            team: allchat
          annotations:
            summary: "High message drop rate (>5%)"
            description: |
              Message drop rate is {{ $value | humanizePercentage }} (threshold: 5%).

              Impact: Users are missing chat messages.

              Action Required:
              1. Check Redis stream health
              2. Check processor logs: kubectl logs -n allchat -l app=message-processor
              3. Verify Redis connection pool
              4. Check for backpressure or rate limiting

        # Shard Load Imbalance - Channel distribution unbalanced
        - alert: ShardLoadImbalance
          expr: shard_imbalance_ratio > 0.7
          for: 10m
          labels:
            severity: warning
            team: allchat
          annotations:
            summary: "Channel load imbalance detected (ratio {{ $value | humanize }})"
            description: |
              Load imbalance ratio has exceeded 0.7 for more than 10 minutes.
              Current ratio: {{ $value | humanize }} (threshold: 0.7)

              Impact: Some pods are handling significantly more channels than others,
              leading to uneven resource usage and potential performance degradation.

              Remediation Steps:
              1. Check if rebalancing is in cooldown: kubectl logs -n allchat -l app=source-manager | grep "cooldown"
              2. Verify rebalancing enabled: Check source-manager config for REBALANCING_ENABLED=true
              3. Check load distribution: Open Grafana dashboard "Sharding & Rebalancing Overview" → Channel Distribution heatmap
              4. Manually trigger rebalancing if needed: curl -X POST http://source-manager:8088/admin/rebalance
              5. Check for pod failures: kubectl get pods -n allchat | grep -v Running

              Auto-rebalancing should trigger automatically. Alert fires if rebalancing
              fails or is stuck in cooldown during persistent imbalance.

        # Shard Coordinator Split-Brain - Multiple leaders detected
        - alert: ShardCoordinatorSplitBrain
          expr: sum(shard_coordinator_is_leader) > 1
          for: 1m
          labels:
            severity: critical
            team: allchat
          annotations:
            summary: "Multiple coordinator leaders detected ({{ $value }} leaders)"
            description: |
              More than one source-manager pod believes it is the leader.
              This is a CRITICAL split-brain condition that can cause conflicting assignments.

              Impact: Multiple coordinators may assign same channel to different pods,
              causing duplicate messages or migration conflicts.

              IMMEDIATE ACTION REQUIRED:
              1. Check all source-manager pods: kubectl get pods -n allchat -l app=source-manager
              2. View leader election logs: kubectl logs -n allchat -l app=source-manager | grep "leader"
              3. Check Kubernetes Lease: kubectl get lease -n allchat coordinator-leader
              4. Restart all source-manager pods: kubectl rollout restart -n allchat deployment/source-manager
              5. Verify single leader after restart: Check alert resolution + Prometheus metric

              Root cause: Kubernetes Lease API clock skew or network partition.
              This should resolve automatically via lease expiration (30s).
