apiVersion: v1
data:
  allchat-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: allchat-critical
        folder: All-Chat Alerts
        interval: 1m
        rules:
          - uid: youtube-quota-critical
            title: YouTube Quota Critical (>95%)
            condition: B
            data:
              - refId: A
                queryType: instant
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: max(listener_quota_usage_percentage{platform="youtube"})
                  refId: A
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                queryType: ""
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: B
                  conditions:
                    - evaluator:
                        params:
                          - 95
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      type: query
                  expression: A
            noDataState: OK
            execErrState: OK
            for: 5m
            annotations:
              summary: "YouTube API quota >95%, approaching exhaustion"
              description: "YouTube quota is at {{ $values.A }}%. Critical threshold exceeded. Only {{ printf \"%.0f\" (sub 1009000 (mul (div $values.A 100) 1009000)) }} units remaining."
            labels:
              severity: critical
              team: allchat
              platform: youtube

          - uid: youtube-quota-exhausted
            title: YouTube Quota Exhausted (100%)
            condition: B
            data:
              - refId: A
                queryType: instant
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: max(listener_quota_usage_percentage{platform="youtube"})
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: B
                  conditions:
                    - evaluator:
                        params:
                          - 100
                        type: gte
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      type: query
                  expression: A
            noDataState: OK
            execErrState: OK
            for: 1m
            annotations:
              summary: "YouTube API quota completely exhausted"
              description: "YouTube API quota at 100%. All API calls will fail until quota reset at midnight PST."
            labels:
              severity: critical
              team: allchat
              platform: youtube

      - orgId: 1
        name: allchat-warnings
        folder: All-Chat Alerts
        interval: 1m
        rules:
          - uid: youtube-quota-high
            title: YouTube Quota High (>80%)
            condition: B
            data:
              - refId: A
                queryType: instant
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: max(listener_quota_usage_percentage{platform="youtube"})
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: B
                  conditions:
                    - evaluator:
                        params:
                          - 80
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      type: query
                  expression: A
            noDataState: OK
            execErrState: OK
            for: 10m
            annotations:
              summary: "YouTube quota >80%, approaching limits"
              description: "YouTube quota at {{ $values.A }}%. Monitor usage and consider throttling."
            labels:
              severity: warning
              team: allchat
              platform: youtube

          - uid: pod-crashloop
            title: All-Chat Pod CrashLooping
            condition: B
            data:
              - refId: A
                queryType: instant
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: increase(kube_pod_container_status_restarts_total{namespace="allchat"}[5m])
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: B
                  conditions:
                    - evaluator:
                        params:
                          - 3
                        type: gte
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      type: query
                  expression: A
            noDataState: OK
            execErrState: OK
            for: 1m
            annotations:
              summary: "Pod {{ $labels.pod }} CrashLooping"
              description: "Pod {{ $labels.pod }} has restarted {{ $values.A }} times in 5 minutes."
            labels:
              severity: critical
              team: allchat

          - uid: pod-not-running
            title: All-Chat Pod Not Running
            condition: B
            data:
              - refId: A
                queryType: instant
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: kube_pod_status_phase{namespace="allchat", phase!="Running", phase!="Succeeded"}
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: B
                  conditions:
                    - evaluator:
                        params:
                          - 1
                        type: gte
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      type: query
                  expression: A
            noDataState: OK
            execErrState: OK
            for: 3m
            annotations:
              summary: "Pod {{ $labels.pod }} not Running"
              description: "Pod {{ $labels.pod }} is in {{ $labels.phase }} state. Service degraded."
            labels:
              severity: critical
              team: allchat
kind: ConfigMap
metadata:
  annotations:
