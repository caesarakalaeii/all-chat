apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-listener
  namespace: allchat
  labels:
    app: youtube-listener
    component: listener
    platform: youtube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: youtube-listener
  template:
    metadata:
      labels:
        app: youtube-listener
        component: listener
        platform: youtube
    spec:
      containers:
      - name: youtube-listener
        image: localhost:5000/allchat-youtube-listener:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8086
          name: http
        env:
        - name: PORT
          value: "8086"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: LOG_LEVEL
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_PORT
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_NAME
        - name: DATABASE_USER
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: allchat-secrets
              key: DATABASE_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: REDIS_PORT
        - name: SOURCE_MANAGER_URL
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: SOURCE_MANAGER_URL
        - name: SOURCE_MANAGER_SECRET
          valueFrom:
            secretKeyRef:
              name: allchat-secrets
              key: SERVICE_JWT_SECRET
        - name: YOUTUBE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: allchat-secrets
              key: YOUTUBE_CLIENT_ID
        - name: YOUTUBE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: allchat-secrets
              key: YOUTUBE_CLIENT_SECRET
        - name: YOUTUBE_REDIRECT_URL
          value: http://localhost:8080/api/v1/auth/youtube/callback
        - name: POLLING_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: POLLING_INTERVAL_MS
        - name: QUOTA_LIMIT_DAILY
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: QUOTA_LIMIT_DAILY
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: youtube-listener
  namespace: allchat
  labels:
    app: youtube-listener
spec:
  type: ClusterIP
  ports:
  - port: 8086
    targetPort: 8086
    protocol: TCP
    name: http
  selector:
    app: youtube-listener
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: youtube-listener-hpa
  namespace: allchat
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: youtube-listener
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
