apiVersion: apps/v1
kind: Deployment
metadata:
  name: overlay-manager
  namespace: allchat
  labels:
    app: overlay-manager
    component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overlay-manager
  template:
    metadata:
      labels:
        app: overlay-manager
        component: manager
    spec:
      containers:
      - name: overlay-manager
        image: localhost:5000/allchat-overlay-manager:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: PORT
          value: "8082"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: LOG_LEVEL
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_PORT
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_NAME
        - name: DATABASE_USER
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: allchat-secrets
              key: DATABASE_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: REDIS_PORT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: allchat-secrets
              key: JWT_SECRET
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: AUTH_SERVICE_URL
        - name: MESSAGE_PROCESSOR_URL
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: MESSAGE_PROCESSOR_URL
        - name: MESSAGE_PROCESSOR_API_KEY
          valueFrom:
            secretKeyRef:
              name: allchat-secrets
              key: MESSAGE_PROCESSOR_API_KEY
        # Phase 13 TTS — AES-GCM master key for overlay_tts_configs.
        # Auth-service already consumes the same secret entry; key name must
        # match prod convention `token-encryption-key` (lowercase-kebab).
        - name: TOKEN_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: allchat-secrets
              key: token-encryption-key
        # Phase 13 TTS — external base URL used to construct OBS URLs in
        # HandleGetTTSConfig / HandleRotateToken responses.
        - name: OVERLAY_PUBLIC_BASE_URL
          value: "https://allch.at"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: overlay-manager
  namespace: allchat
  labels:
    app: overlay-manager
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http
  selector:
    app: overlay-manager
