apiVersion: v1
kind: ConfigMap
metadata:
  name: allchat-config
  namespace: allchat
data:
  # Service URLs
  AUTH_SERVICE_URL: http://auth-service.allchat.svc.cluster.local:8081
  OVERLAY_SERVICE_URL: http://overlay-manager.allchat.svc.cluster.local:8082
  EMOTE_SERVICE_URL: http://emote-service.allchat.svc.cluster.local:8083
  MESSAGE_PROCESSOR_URL: http://message-processor.allchat.svc.cluster.local:8087
  SOURCE_MANAGER_URL: http://source-manager.allchat.svc.cluster.local:8088

  # Database Configuration
  DATABASE_HOST: allchat-cluster-rw.allchat.svc.cluster.local
  DATABASE_PORT: "5432"
  DATABASE_NAME: allchat
  DATABASE_USER: allchat_user

  # Redis Configuration
  REDIS_HOST: redis.allchat.svc.cluster.local
  REDIS_PORT: "6379"

  # Frontend URL
  FRONTEND_URL: https://allch.at

  # CORS Configuration
  CORS_ORIGIN: https://allch.at

  # JWT Configuration
  JWT_EXPIRY_HOURS: "24"

  # YouTube API Configuration
  POLLING_INTERVAL_MS: "2000"
  QUOTA_LIMIT_DAILY: "10000"

  # Logging
  LOG_LEVEL: info
