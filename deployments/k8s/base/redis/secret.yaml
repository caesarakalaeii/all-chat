# Redis authentication secret.
#
# SECURITY (H7): Redis must not run unauthenticated in the cluster. This Secret
# holds the REDIS_PASSWORD used by `redis-server --requirepass` and by every
# service that connects to Redis.
#
# This manifest intentionally contains NO plaintext password (`stringData` /
# `data` left empty). Populate the `redis-password` key out-of-band BEFORE
# enabling `--requirepass` on the redis Deployment, using one of:
#   - sealed-secrets / external-secrets
#   - kubectl create secret generic redis-auth -n allchat \
#         --from-literal=redis-password='<strong-password>'
#   - ansible-vault (see deployments/ansible)
#
# IMPORTANT — DEFAULT-OFF BEHAVIOUR:
# The redis Deployment runs `redis-server` with `--requirepass "$REDIS_PASSWORD"`.
# While this key is empty, Redis treats it as NO password (AUTH disabled) so the
# existing services keep working. The moment a real password is set here, Redis
# requires AUTH — services MUST read REDIS_PASSWORD (currently only api-gateway,
# source-manager and twitch-listener do; the other Redis clients hardcode an
# empty password and will fail until updated). See deployments/k8s/base/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: allchat
  labels:
    app: redis
    component: cache
type: Opaque
stringData:
  # Placeholder — empty by default (AUTH disabled). Populate out-of-band.
  redis-password: ""
