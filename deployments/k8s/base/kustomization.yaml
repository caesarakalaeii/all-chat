apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: allchat

resources:
  # Shared Configuration
  - configmap.yaml

  # Infrastructure
  - postgres/deployment.yaml
  - postgres/configmap.yaml
  - redis/deployment.yaml

  # Phase 1 - Foundation
  - auth-service/deployment.yaml
  - overlay-manager/deployment.yaml

  # Phase 2 - Infrastructure Services
  - emote-service/deployment.yaml
  - api-gateway/deployment.yaml

  # Phase 3 - Twitch Real-Time
  - twitch-listener/deployment.yaml
  - message-processor/deployment.yaml

  # Phase 4 - YouTube Integration
  - youtube-listener/deployment.yaml
  - source-manager/deployment.yaml

commonLabels:
  project: allchat
  managed-by: kustomize

images:
  - name: allchat-auth-service:latest
    newName: ghcr.io/caesarakalaeii/allchat-auth-service
    newTag: main
  - name: allchat-overlay-manager:latest
    newName: ghcr.io/caesarakalaeii/allchat-overlay-manager
    newTag: main
  - name: allchat-emote-service:latest
    newName: ghcr.io/caesarakalaeii/allchat-emote-service
    newTag: main
  - name: allchat-api-gateway:latest
    newName: ghcr.io/caesarakalaeii/allchat-api-gateway
    newTag: main
  - name: allchat-twitch-listener:latest
    newName: ghcr.io/caesarakalaeii/allchat-twitch-listener
    newTag: main
  - name: allchat-youtube-listener:latest
    newName: ghcr.io/caesarakalaeii/allchat-youtube-listener
    newTag: main
  - name: allchat-message-processor:latest
    newName: ghcr.io/caesarakalaeii/allchat-message-processor
    newTag: main
  - name: allchat-source-manager:latest
    newName: ghcr.io/caesarakalaeii/allchat-source-manager
    newTag: main
