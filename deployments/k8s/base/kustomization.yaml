apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: allchat

resources:
  # Shared Configuration
  - configmap.yaml

  # Infrastructure
  - postgres/deployment.yaml
  - postgres/configmap.yaml
  - redis/deployment.yaml
  # redis/secret.yaml is intentionally NOT listed under resources (audit M5).
  # Shipping the empty-valued redis-auth Secret as an apply-able resource meant
  # any `kubectl apply -k` overwrote a live REDIS_PASSWORD back to empty,
  # silently disabling Redis AUTH. The Secret must be managed out-of-band
  # (sealed-secrets / external-secrets / kubectl create secret) BEFORE enabling
  # --requirepass. See redis/secret.yaml for the reference manifest + instructions.

  # Network hardening (H7): default-deny + metadata-IP block.
  - networkpolicies.yaml

  # Phase 1 - Foundation
  - auth-service/deployment.yaml
  - overlay-manager/deployment.yaml

  # Phase 2 - Infrastructure Services
  - emote-service/deployment.yaml
  - api-gateway/deployment.yaml
  - api-gateway/hpa.yaml

  # Phase 3 - Twitch Real-Time
  - twitch-listener/deployment.yaml
  - twitch-listener/hpa.yaml
  - twitch-eventsub-listener/deployment.yaml
  - twitch-eventsub-listener/hpa.yaml
  - message-processor/deployment.yaml
  - message-processor/hpa.yaml

  # Phase 4 - YouTube Integration
  - youtube-listener/deployment.yaml
  - source-manager/deployment.yaml

  # Phase 5 - Discord Listener (v1.5)
  - discord-listener/deployment.yaml
  - discord-listener/hpa.yaml
  - discord-listener/servicemonitor.yaml

commonLabels:
  project: allchat
  managed-by: kustomize

# TODO(prod): Pin every image below to an immutable digest (@sha256:...) instead
# of the mutable `main` tag to prevent supply-chain drift (M13). The
# imagePullPolicy on each Deployment is set to IfNotPresent so a cached image is
# reused rather than re-pulled against a mutable tag. Generate digests from the
# exact built image, e.g.:
#   crane digest ghcr.io/caesarakalaeii/allchat-api-gateway:main
# and replace newTag with `@sha256:<digest>` (use `digest:` field in kustomize).
images:
  - name: allchat-auth-service:latest
    newName: ghcr.io/caesarakalaeii/allchat-auth-service
    newTag: main
  - name: allchat-overlay-manager:latest
    newName: ghcr.io/caesarakalaeii/allchat-overlay-manager
    newTag: main
  - name: allchat-emote-service:latest
    newName: ghcr.io/caesarakalaeii/allchat-emote-service
    newTag: main
  - name: allchat-api-gateway:latest
    newName: ghcr.io/caesarakalaeii/allchat-api-gateway
    newTag: main
  - name: allchat-twitch-listener:latest
    newName: ghcr.io/caesarakalaeii/allchat-twitch-listener
    newTag: main
  - name: allchat-twitch-eventsub-listener:latest
    newName: ghcr.io/caesarakalaeii/allchat-twitch-eventsub-listener
    newTag: main
  - name: allchat-youtube-listener:latest
    newName: ghcr.io/caesarakalaeii/allchat-youtube-listener
    newTag: main
  - name: allchat-message-processor:latest
    newName: ghcr.io/caesarakalaeii/allchat-message-processor
    newTag: main
  - name: allchat-source-manager:latest
    newName: ghcr.io/caesarakalaeii/allchat-source-manager
    newTag: main
  - name: allchat-discord-listener:latest
    newName: ghcr.io/caesarakalaeii/allchat-discord-listener
    newTag: main
