apiVersion: v1
kind: ServiceAccount
metadata:
  name: source-manager
  namespace: allchat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: source-manager-coordinator
  namespace: allchat
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: source-manager-coordinator
  namespace: allchat
subjects:
- kind: ServiceAccount
  name: source-manager
  namespace: allchat
roleRef:
  kind: Role
  name: source-manager-coordinator
  apiGroup: rbac.authorization.k8s.io
