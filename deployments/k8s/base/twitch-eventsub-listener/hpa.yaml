apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: twitch-eventsub-listener
  namespace: allchat
  labels:
    app: twitch-eventsub-listener
    component: listener
    platform: twitch
    event-source: eventsub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: twitch-eventsub-listener
  minReplicas: 2  # Keep 2 for HA (leader + follower for failover)
  maxReplicas: 2  # Fixed at 2 (leader election ensures only 1 active)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
