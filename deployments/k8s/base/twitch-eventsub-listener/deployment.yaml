apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitch-eventsub-listener
  namespace: allchat
  labels:
    app: twitch-eventsub-listener
    component: listener
    platform: twitch
    event-source: eventsub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twitch-eventsub-listener
  template:
    metadata:
      labels:
        app: twitch-eventsub-listener
        component: listener
        platform: twitch
        event-source: eventsub
    spec:
      containers:
      - name: twitch-eventsub-listener
        image: localhost:5000/allchat-twitch-eventsub-listener:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8090
          name: http
        env:
        - name: PORT
          value: "8090"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: LOG_LEVEL
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_PORT
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_NAME
        - name: DATABASE_USER
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: allchat-secrets
              key: DATABASE_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: REDIS_PORT
        - name: TWITCH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: twitch-eventsub-creds
              key: client-id
        - name: TWITCH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: twitch-eventsub-creds
              key: client-secret
        - name: SOURCE_MANAGER_URL
          valueFrom:
            configMapKeyRef:
              name: allchat-config
              key: SOURCE_MANAGER_URL
        - name: SOURCE_MANAGER_SECRET
          valueFrom:
            secretKeyRef:
              name: allchat-secrets
              key: SERVICE_JWT_SECRET
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8090
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: twitch-eventsub-listener
  namespace: allchat
  labels:
    app: twitch-eventsub-listener
spec:
  type: ClusterIP
  ports:
  - port: 8090
    targetPort: 8090
    protocol: TCP
    name: http
  selector:
    app: twitch-eventsub-listener
