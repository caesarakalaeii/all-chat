apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kick-listener
  namespace: allchat
  labels:
    app: kick-listener
    component: listener
    platform: kick
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kick-listener
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0  # Immediate scale-up for testing migration protocol
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
