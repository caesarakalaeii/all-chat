apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: goodgame-listener
  namespace: allchat
  labels:
    app: goodgame-listener
    component: listener
    platform: goodgame
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: goodgame-listener
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
