---
# Impressum ConfigMap — mount this into the frontend pod at /etc/allchat/
# Copy this file, fill in your details, and apply:
#   cp impressum-configmap.example.yaml impressum-configmap.yaml
#   kubectl -n allchat apply -f impressum-configmap.yaml
#
# The frontend Deployment must mount the ConfigMap:
#   volumes:
#     - name: impressum
#       configMap:
#         name: impressum
#   containers:
#     - name: frontend
#       volumeMounts:
#         - name: impressum
#           mountPath: /etc/allchat
#           readOnly: true
