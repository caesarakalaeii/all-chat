apiVersion: v1
kind: Secret
metadata:
  name: test-stream-config
  namespace: allchat-test
type: Opaque
stringData:
  # Replace PLACEHOLDER_VIDEO_ID with an active YouTube live stream
  # Requirements:
  # - Stream must be live for 24+ hours (gaming streams, 24/7 news, etc.)
  # - Stream must have active chat
  # - Example: "dQw4w9WgXcQ"
  video_id: "PLACEHOLDER_VIDEO_ID"
