apiVersion: v1
kind: Namespace
metadata:
  name: allchat-test
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dual-listener-test
  namespace: allchat-test
spec:
  # Allow 25 hours for 24h test + startup/shutdown buffer
  activeDeadlineSeconds: 90000
  backoffLimit: 0  # Don't retry on failure
  template:
    metadata:
      labels:
        app: dual-listener-test
    spec:
      restartPolicy: Never
      containers:
      # Official youtube-listener (uses YouTube Data API)
      - name: official-listener
        image: allchat/youtube-listener:latest
        env:
        - name: REDIS_HOST
          value: redis-dual-listener-test
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_STREAM_PREFIX
          value: "official"
        - name: YOUTUBE_VIDEO_ID
          valueFrom:
            secretKeyRef:
              name: test-stream-config
              key: video_id
        # YouTube API credentials (should already be configured in listener)
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

      # InnerTube youtube-listener (uses InnerTube API)
      - name: innertube-listener
        image: allchat/youtube-listener-innertube:latest
        env:
        - name: REDIS_HOST
          value: redis-dual-listener-test
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_STREAM_PREFIX
          value: "innertube"
        - name: YOUTUBE_VIDEO_ID
          valueFrom:
            secretKeyRef:
              name: test-stream-config
              key: video_id
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

      # Comparator (test harness)
      - name: comparator
        image: allchat/dual-listener-test:latest
        args:
        - "-duration=24h"
        - "-redis-host=redis-dual-listener-test:6379"
        - "-output-dir=/artifacts"
        - "-official-prefix=official"
        - "-innertube-prefix=innertube"
        env:
        - name: LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: artifacts
          mountPath: /artifacts
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"

      volumes:
      - name: artifacts
        emptyDir: {}
