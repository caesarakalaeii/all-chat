apiVersion: v1
kind: Service
metadata:
  name: redis-dual-listener-test
  namespace: allchat-test
spec:
  selector:
    app: redis-dual-listener-test
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-dual-listener-test
  namespace: allchat-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-dual-listener-test
  template:
    metadata:
      labels:
        app: redis-dual-listener-test
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
