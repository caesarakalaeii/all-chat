name: Build and Push Docker Images

on:
  push:
    branches:
      - '**'  # Build on ANY branch
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'shared/**'
      - 'migrations/**'
      - 'scripts/run-migrations.sh'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: caesarakalaeii/allchat

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.changes.outputs.auth-service }}
      overlay-manager: ${{ steps.changes.outputs.overlay-manager }}
      emote-service: ${{ steps.changes.outputs.emote-service }}
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      twitch-listener: ${{ steps.changes.outputs.twitch-listener }}
      twitch-eventsub-listener: ${{ steps.changes.outputs.twitch-eventsub-listener }}
      youtube-listener: ${{ steps.changes.outputs.youtube-listener }}
      youtube-listener-innertube: ${{ steps.changes.outputs.youtube-listener-innertube }}
      youtube-quota-monitor: ${{ steps.changes.outputs.youtube-quota-monitor }}
      kick-listener: ${{ steps.changes.outputs.kick-listener }}
      tiktok-listener: ${{ steps.changes.outputs.tiktok-listener }}
      message-processor: ${{ steps.changes.outputs.message-processor }}
      source-manager: ${{ steps.changes.outputs.source-manager }}
      token-refresh-service: ${{ steps.changes.outputs.token-refresh-service }}
      moderation-service: ${{ steps.changes.outputs.moderation-service }}
      payment-service: ${{ steps.changes.outputs.payment-service }}
      engagement-service: ${{ steps.changes.outputs.engagement-service }}
      share-service: ${{ steps.changes.outputs.share-service }}
      discord-bot: ${{ steps.changes.outputs.discord-bot }}
      discord-listener: ${{ steps.changes.outputs.discord-listener }}
      support-bot: ${{ steps.changes.outputs.support-bot }}
      frontend: ${{ steps.changes.outputs.frontend }}
      shared: ${{ steps.changes.outputs.shared }}
      migrations: ${{ steps.changes.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            auth-service:
              - 'services/auth-service/**'
              - 'shared/**'
            overlay-manager:
              - 'services/overlay-manager/**'
              - 'shared/**'
            emote-service:
              - 'services/emote-service/**'
              - 'shared/**'
            api-gateway:
              - 'services/api-gateway/**'
              - 'shared/**'
            twitch-listener:
              - 'services/twitch-listener/**'
              - 'shared/**'
            twitch-eventsub-listener:
              - 'services/twitch-eventsub-listener/**'
              - 'shared/**'
            youtube-listener:
              - 'services/youtube-listener/**'
              - 'shared/**'
            youtube-listener-innertube:
              - 'services/youtube-listener-innertube/**'
              - 'shared/**'
            youtube-quota-monitor:
              - 'services/youtube-quota-monitor/**'
              - 'shared/**'
            kick-listener:
              - 'services/kick-listener/**'
              - 'shared/**'
            tiktok-listener:
              - 'services/tiktok-listener/**'
            message-processor:
              - 'services/message-processor/**'
              - 'shared/**'
            source-manager:
              - 'services/source-manager/**'
              - 'shared/**'
            token-refresh-service:
              - 'services/token-refresh-service/**'
              - 'shared/**'
              - 'services/auth-service/oauth/**'
            moderation-service:
              - 'services/moderation-service/**'
              - 'shared/**'
            payment-service:
              - 'services/payment-service/**'
              - 'shared/**'
            engagement-service:
              - 'services/engagement-service/**'
              - 'shared/**'
              - 'services/message-processor/**'
            share-service:
              - 'services/share-service/**'
              - 'shared/**'
            discord-bot:
              - 'services/discord-bot/**'
            discord-listener:
              - 'services/discord-listener/**'
              - 'shared/**'
            support-bot:
              - 'services/support-bot/**'
            frontend:
              - 'frontend/**'
            shared:
              - 'shared/**'
            migrations:
              - 'migrations/**'
              - 'scripts/run-migrations.sh'

  build-and-push:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false  # Continue building other services even if one fails
      matrix:
        service:
          - name: auth-service
            changed: ${{ needs.detect-changes.outputs.auth-service }}
            path: services/auth-service
          - name: overlay-manager
            changed: ${{ needs.detect-changes.outputs.overlay-manager }}
            path: services/overlay-manager
          - name: emote-service
            changed: ${{ needs.detect-changes.outputs.emote-service }}
            path: services/emote-service
          - name: api-gateway
            changed: ${{ needs.detect-changes.outputs.api-gateway }}
            path: services/api-gateway
          - name: twitch-listener
            changed: ${{ needs.detect-changes.outputs.twitch-listener }}
            path: services/twitch-listener
          - name: twitch-eventsub-listener
            changed: ${{ needs.detect-changes.outputs.twitch-eventsub-listener }}
            path: services/twitch-eventsub-listener
          - name: youtube-listener
            changed: ${{ needs.detect-changes.outputs.youtube-listener }}
            path: services/youtube-listener
          - name: youtube-listener-innertube
            changed: ${{ needs.detect-changes.outputs.youtube-listener-innertube }}
            path: services/youtube-listener-innertube
          - name: youtube-quota-monitor
            changed: ${{ needs.detect-changes.outputs.youtube-quota-monitor }}
            path: services/youtube-quota-monitor
          - name: kick-listener
            changed: ${{ needs.detect-changes.outputs.kick-listener }}
            path: services/kick-listener
          - name: tiktok-listener
            changed: ${{ needs.detect-changes.outputs.tiktok-listener }}
            path: services/tiktok-listener
          - name: message-processor
            changed: ${{ needs.detect-changes.outputs.message-processor }}
            path: services/message-processor
          - name: source-manager
            changed: ${{ needs.detect-changes.outputs.source-manager }}
            path: services/source-manager
          - name: token-refresh-service
            changed: ${{ needs.detect-changes.outputs.token-refresh-service }}
            path: services/token-refresh-service
          - name: moderation-service
            changed: ${{ needs.detect-changes.outputs.moderation-service }}
            path: services/moderation-service
          - name: payment-service
            changed: ${{ needs.detect-changes.outputs.payment-service }}
            path: services/payment-service
          - name: engagement-service
            changed: ${{ needs.detect-changes.outputs.engagement-service }}
            path: services/engagement-service
          - name: share-service
            changed: ${{ needs.detect-changes.outputs.share-service }}
            path: services/share-service
          - name: discord-bot
            changed: ${{ needs.detect-changes.outputs.discord-bot }}
            path: services/discord-bot
          - name: discord-listener
            changed: ${{ needs.detect-changes.outputs.discord-listener }}
            path: services/discord-listener
          - name: support-bot
            changed: ${{ needs.detect-changes.outputs.support-bot }}
            path: services/support-bot
          - name: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}
            path: frontend
          - name: migrations
            changed: ${{ needs.detect-changes.outputs.migrations }}
            path: migrations

    steps:
      - name: Checkout repository
        if: matrix.service.changed == 'true' || needs.detect-changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: matrix.service.changed == 'true' || needs.detect-changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: matrix.service.changed == 'true' || needs.detect-changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: matrix.service.changed == 'true' || needs.detect-changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false

      - name: Build and push
        if: matrix.service.changed == 'true' || needs.detect-changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.service.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}

      - name: Output image details
        if: matrix.service.changed == 'true' || needs.detect-changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Service: ${{ matrix.service.name }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Image pushed to: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}"

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        service:
          - auth-service
          - overlay-manager
          - emote-service
          - api-gateway
          - twitch-listener
          - twitch-eventsub-listener
          - youtube-listener
          - youtube-quota-monitor
          - message-processor
          - share-service
          - source-manager
          - token-refresh-service
          - moderation-service
          - payment-service
          - discord-listener

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run tests for ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          go mod download
          go test -v -short ./...

  test-node:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/support-bot/package-lock.json

      - name: Run tests for support-bot
        run: |
          cd services/support-bot
          npm ci
          npm test
