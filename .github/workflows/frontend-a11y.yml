name: Frontend A11y Gate

# The accessibility gate for the WCAG 2.2 AA initiative. Deliberately SEPARATE
# from frontend-quality.yml (dispatch-only/dead because of pre-existing lint
# debt): this workflow contains ONLY a11y checks so it stays green
# independently of that debt and can gate PRs immediately.
#
# These three jobs are REQUIRED status checks on main. A workflow gated by a
# top-level `paths:` filter is skipped ENTIRELY on backend-only PRs, so its
# required contexts are never reported and the PR stays permanently "Expected"
# (blocked) — see ADR-0033 / PR #577. Instead we trigger on every PR and gate
# each job with a paths-filter: when nothing frontend-relevant changed the jobs
# are SKIPPED (present-but-skipped, which branch protection treats as passing),
# and when frontend (or this workflow) changes the real a11y suite runs. This is
# the intra-workflow "skip shim" — it avoids the mixed-PR double-run/race a
# separate paths-ignore shim would introduce.
#
# Ratchets (may only shrink, never grow):
#   - frontend/eslint.a11y.suppressions.json  (jsx-a11y strict baseline)
#   - frontend/tests/e2e/a11y-baseline.json   (axe smoke baseline)
#
# EVERY job sets `timeout-minutes`. Without it a job inherits GitHub's 6-hour
# default, and on 2026-08-19 both Chromium jobs hung on the Playwright install
# for ~4 hours on PR #729. A hang is worse than a failure here: the required
# contexts never report, so the PR sits "Expected"/blocked with no signal, and
# several agent sessions were burnt re-verifying a branch that was already
# correct. The install steps are additionally retried under a per-attempt cap,
# because that step normally takes ~40s but has been seen taking 11 minutes.

on:
  pull_request:

jobs:
  # Detect whether anything frontend-relevant (or this workflow) changed. When it
  # did not, the a11y jobs below are skipped, satisfying their required contexts
  # without running the full suite on backend-only PRs.
  changes:
    runs-on: ubuntu-latest
    # Observed ~15-30s. Only a checkout plus a paths-filter.
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-a11y.yml'

  a11y-static:
    name: A11y lint + token contrast
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # Observed ~30-40s. No browser involved.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: A11y ESLint (jsx-a11y strict, suppression-ratcheted)
        run: >
          npx eslint -c eslint.a11y.config.mjs
          --suppressions-location eslint.a11y.suppressions.json
          'src/**/*.tsx'

      - name: Design-token contrast lock
        run: npx vitest --project unit --run src/app/__tests__/token-contrast.test.ts

  a11y-storybook:
    name: Storybook axe (components + pages)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # Observed ~1.5min end to end. Headroom is almost entirely for the install
    # step's retries below; anything past this is a stall, not slow work.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Retried under a per-attempt cap: normally ~40s, but a stalled mirror has
      # produced an 11-minute run and a ~4-hour hang. Retrying beats waiting a
      # stall out, and beats reporting a red required check that looks like a
      # code defect. 5m is many times the normal duration, so a tripped cap
      # means stuck, not slow.
      - name: Install Playwright Chromium (vitest browser provider)
        timeout-minutes: 16
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 5m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium install attempt $attempt stalled or failed; retrying"
            sleep 10
          done
          echo "::error::Chromium install failed after 3 attempts"
          exit 1

      - name: Storybook a11y tests (axe violations = error)
        run: npx vitest --project storybook --run

  a11y-smoke:
    name: Axe page smoke (Playwright)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # Observed ~1.5-3.5min end to end. As above, the headroom is for the
    # install step's retries rather than for the smoke run itself.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same bounded retry as a11y-storybook; this is the job that hung for ~4
      # hours on PR #729 and the one that logged the 11-minute install.
      - name: Install Playwright Chromium
        timeout-minutes: 16
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 5m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium install attempt $attempt stalled or failed; retrying"
            sleep 10
          done
          echo "::error::Chromium install failed after 3 attempts"
          exit 1

      - name: Axe smoke over app pages
        run: npx playwright test a11y --project=chromium

      - name: Upload axe reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: axe-reports
          path: frontend/playwright-report/
          retention-days: 14
