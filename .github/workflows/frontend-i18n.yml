name: Frontend i18n Gate

# The gate that keeps user-visible copy in the string catalog at
# frontend/src/lib/i18n/ instead of at its render site. Deliberately SEPARATE
# from frontend-quality.yml (dispatch-only/dead because of pre-existing lint
# debt) and from frontend-a11y.yml: this workflow contains ONLY the i18n lint so
# it stays green independently of that debt and can gate PRs immediately. See
# docs/frontend/I18N.md and docs/adr/0055-ui-string-catalog-without-locale-routing.md.
#
# This job is a REQUIRED status check on main. A workflow gated by a top-level
# `paths:` filter is skipped ENTIRELY on backend-only PRs, so its required
# contexts are never reported and the PR stays permanently "Expected" (blocked)
# — see ADR-0033 / PR #577. Instead we trigger on every PR and gate the job with
# a paths-filter: when nothing frontend-relevant changed the job is SKIPPED
# (present-but-skipped, which branch protection treats as passing), and when
# frontend (or this workflow) changes the real lint runs. This is the
# intra-workflow "skip shim" — it avoids the mixed-PR double-run/race a separate
# paths-ignore shim would introduce.
#
# Ratchet (may only shrink, never grow):
#   - frontend/eslint.i18n.suppressions.json
#
# EVERY job sets `timeout-minutes`. Without it a job inherits GitHub's 6-hour
# default, and on PR #729 two jobs hung for ~4 hours on an install step. A hang
# is worse than a failure here: the required context never reports, so the PR
# sits "Expected"/blocked with no signal at all.

on:
  pull_request:

jobs:
  # Detect whether anything frontend-relevant (or this workflow) changed. When it
  # did not, the lint job below is skipped, satisfying its required context
  # without running on backend-only PRs.
  changes:
    runs-on: ubuntu-latest
    # Observed ~15-30s on the sibling a11y workflow. Only a checkout plus a
    # paths-filter.
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-i18n.yml'

  i18n-lint:
    name: i18n lint (no literal UI strings)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # ESLint over ~230 .tsx files, no browser involved. The sibling a11y lint
    # job is observed at ~30-40s on the same tree.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: i18n ESLint (no literal UI strings, suppression-ratcheted)
        run: >
          npx eslint -c eslint.i18n.config.mjs
          --suppressions-location eslint.i18n.suppressions.json
          'src/**/*.tsx'
