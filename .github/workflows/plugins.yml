name: Desktop Plugins

# Parity check for the two desktop control surfaces from ADR-0049, which live in
# their own repositories: caesarakalaeii/allchat-streamdeck (TypeScript, Elgato
# SDK, Windows + macOS) and caesarakalaeii/allchat-streamcontroller (Python,
# StreamController, Linux). Each repository builds, tests and packages itself.
#
# DRIFT IS THE STATED RISK. ADR-0049: "the button set now exists twice and will
# diverge unless it is defined once." scripts/check-plugin-parity.py is that
# definition, and it stays here because All-Chat owns the API both plugins call.
# Both plugin repositories run the same check on their own PRs; this workflow
# covers the third side, a change to the script itself, plus a weekly run that
# catches the two mains drifting when cross-repo PRs merge in the wrong order.
#
# Structure follows frontend-a11y.yml deliberately: an intra-workflow "skip
# shim" (a `changes` job plus a per-job `if:`) rather than a top-level `paths:`
# filter, because a workflow skipped by `paths:` never reports its contexts and
# a required check would leave PRs permanently "Expected"/blocked (ADR-0033).
#
# EVERY job sets timeout-minutes. Without it a job inherits GitHub's 6-hour
# default, and on 2026-08-19 two hung installs sat for ~4 hours on PR #729 (see
# PR #731). A hang is worse than a failure: there is no signal to act on.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    # Observed ~15-30s. A checkout plus a paths-filter.
    timeout-minutes: 10
    outputs:
      parity: ${{ steps.filter.outputs.parity }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            parity:
              - 'scripts/check-plugin-parity.py'
              - '.github/workflows/plugins.yml'

  parity:
    name: Plugin parity (ADR-0049 action list)
    needs: changes
    if: needs.changes.outputs.parity == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Observed <1s for the script; the time is the three checkouts.
    timeout-minutes: 10
    env:
      # A change spanning repositories uses one branch name in each of them.
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      # The script expects all three checkouts side by side under their
      # repository names; see its docstring.
      - uses: actions/checkout@v7
        with:
          path: all-chat

      # Same-named branch when it exists, main otherwise. This is what lets a new
      # button land on both plugins and in the script's action list together.
      - name: Resolve plugin refs
        id: refs
        run: |
          for repo in allchat-streamdeck allchat-streamcontroller; do
            if git ls-remote --exit-code --heads "https://github.com/caesarakalaeii/${repo}.git" "$BRANCH" >/dev/null; then
              ref="$BRANCH"
            else
              ref=main
            fi
            echo "${repo}=${ref}" >> "$GITHUB_OUTPUT"
            echo "${repo}: ${ref}"
          done

      - uses: actions/checkout@v7
        with:
          repository: caesarakalaeii/allchat-streamdeck
          ref: ${{ steps.refs.outputs.allchat-streamdeck }}
          path: allchat-streamdeck

      - uses: actions/checkout@v7
        with:
          repository: caesarakalaeii/allchat-streamcontroller
          ref: ${{ steps.refs.outputs.allchat-streamcontroller }}
          path: allchat-streamcontroller

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Fails when a button, a user-visible constant or a keep-in-sync pointer
      # exists on one plugin and not the other. See the script's docstring for
      # what is pinned and why each check is there.
      - name: Action list, shared constants and sync pointers
        run: python3 all-chat/scripts/check-plugin-parity.py
