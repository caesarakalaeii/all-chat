version: 2
updates:
  # Shared Go modules
  - package-ecosystem: "gomod"
    directory: "/shared"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "go"
    open-pull-requests-limit: 5
    groups:
      shared-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/shared/ratelimit"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/shared/signing"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"

  # API Gateway
  - package-ecosystem: "gomod"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "api-gateway"

  # Auth Service
  - package-ecosystem: "gomod"
    directory: "/services/auth-service"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "auth-service"

  # Emote Service
  - package-ecosystem: "gomod"
    directory: "/services/emote-service"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "emote-service"

  # Kick Listener
  - package-ecosystem: "gomod"
    directory: "/services/kick-listener"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "kick-listener"

  # Message Processor
  - package-ecosystem: "gomod"
    directory: "/services/message-processor"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "message-processor"

  # Overlay Manager
  - package-ecosystem: "gomod"
    directory: "/services/overlay-manager"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "overlay-manager"

  # Source Manager
  - package-ecosystem: "gomod"
    directory: "/services/source-manager"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "source-manager"

  # TikTok Listener
  - package-ecosystem: "gomod"
    directory: "/services/tiktok-listener"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "tiktok-listener"

  # Token Refresh Service
  - package-ecosystem: "gomod"
    directory: "/services/token-refresh-service"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "token-refresh-service"

  # Twitch EventSub Listener
  - package-ecosystem: "gomod"
    directory: "/services/twitch-eventsub-listener"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "twitch-eventsub-listener"

  # Twitch Listener
  - package-ecosystem: "gomod"
    directory: "/services/twitch-listener"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "twitch-listener"

  # YouTube Listener
  - package-ecosystem: "gomod"
    directory: "/services/youtube-listener"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
      - "youtube-listener"

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      next:
        patterns:
          - "next*"
      testing:
        patterns:
          - "@testing-library/*"
          - "@playwright/*"
          - "vitest"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Docker (for base images in Dockerfiles)
  - package-ecosystem: "docker"
    directory: "/services/api-gateway"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/auth-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/emote-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/kick-listener"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/message-processor"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/overlay-manager"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/source-manager"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/token-refresh-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/twitch-eventsub-listener"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/twitch-listener"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/youtube-listener"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
