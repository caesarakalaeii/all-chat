*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #07070a; --surface: #0d0d12;
  --border: rgba(255,255,255,0.06);
  --text: #e8e8f0; --mono: 'DM Mono', monospace;
}
body {
  background: var(--bg); color: var(--text);
  font-family: 'Barlow', sans-serif;
  padding: 48px; display: flex; flex-direction: column; gap: 10px;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.013) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.013) 1px, transparent 1px);
  background-size: 40px 40px;
}
.page-label {
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  color: #333; font-family: var(--mono); margin-bottom: 16px; position: relative; z-index: 1;
}
.section-label {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: #444; font-family: var(--mono); margin: 20px 0 8px; position: relative; z-index: 1;
}
.row {
  display: flex; align-items: center; gap: 32px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 22px 28px;
  position: relative; z-index: 1;
}
.row-label {
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: #444; font-family: var(--mono); width: 200px; flex-shrink: 0; line-height: 1.8;
}
.logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.logo-text { font-size: 16px; font-weight: 800; letter-spacing: -0.04em; color: var(--text); }
.logo-lg .logo-text { font-size: 26px; }

.bubble {
  position: relative; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.bubble .inf-svg {
  position: absolute;
  /* Nudge up to optically centre in the bubble body, excluding the tail spike.
     The spike adds ~20% extra height below — shift up by ~10% of bubble height. */
  transform: translateY(-10%);
  filter: drop-shadow(0 0 3px rgba(0,0,0,0.9));
}

<script>
// ── 4-layer solid colour snake ──
//
// Each colour is its own path with stroke-dasharray = [segLen/4, huge].
// The 4 paths are offset by segLen/4 from each other so they tile perfectly.
// One full loop = total path length. Colours stay pure, lengths stay equal.
//
// Two copies per colour (A and B) for seamless wrap — same trick as before.

const LOGOS   = ['logo-a', 'logo-b', 'logo-c', 'logo-d'];
const SEG_FRAC = 0.55;  // total coloured snake as fraction of path
const LOOP_MS  = 6000;  // one full revolution in ms — slow and smooth

// Measure from first path in each SVG
const lengths = LOGOS.map(id => {
  const path = document.querySelector(`#${id} .seg`);
  return path ? path.getTotalLength() : 60;
});

// Set dasharray on every seg path
LOGOS.forEach((id, li) => {
  const total  = lengths[li];
  const seg    = total * SEG_FRAC;
  const piece  = seg / 4;          // each colour gets exactly 1/4 of the snake
  const huge   = total * 10;       // gap so large second dash never appears

  document.querySelectorAll(`#${id} .seg`).forEach((path, ci) => {
    path.style.strokeDasharray = `${piece} ${huge}`;
    // Will be set each frame via dashoffset
  });
});

function tick(now) {
  LOGOS.forEach((id, li) => {
    const total = lengths[li];
    const seg   = total * SEG_FRAC;
    const piece = seg / 4;

    // Head position — linear, constant speed
    const head = (now / LOOP_MS * total) % total;

    document.querySelectorAll(`#${id} .seg`).forEach((path, ci) => {
      const colourOffset = ci * piece;
      const t = ((head - colourOffset) % total + total) % total;

      // Two-copy seamless wrap:
      // dasharray = piece  (total*2) so gap is always >> total
      // Primary copy at -t, secondary copy at -(t - total)
      // When primary exits end, secondary already entering from start
      path.style.strokeDasharray  = `${piece} ${total * 2}`;
      path.style.strokeDashoffset = `${-t}`;

      // Secondary copy — sibling with class 'seg-b'
      const bPath = path.nextElementSibling;
      if (bPath && bPath.classList.contains('seg-b')) {
        bPath.style.strokeDasharray  = `${piece} ${total * 2}`;
        bPath.style.strokeDashoffset = `${-(t - total)}`;
      }
    });
  });

  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
