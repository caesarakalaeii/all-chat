version: '3.9'

# Frontend Development Environment
# Minimal services needed for frontend testing and development
# Usage: docker-compose -f docker-compose.frontend.yml up
#
# SECURITY (M16): Internal ports are bound to 127.0.0.1 and Redis auth is wired
# (default-off). Dev secret defaults are overridable via env so prod-like values
# can be supplied without editing the file. This is the DEV profile — do NOT use
# these defaults in production; set real values via env / .env instead.
#
# REDIS AUTH: `redis-server` runs with `--requirepass "$REDIS_PASSWORD"`. While
# REDIS_PASSWORD is empty (default) AUTH is disabled. Setting a non-empty value
# enables AUTH — only services that read REDIS_PASSWORD (api-gateway,
# source-manager, twitch-listener) connect; others hardcode empty and must be
# updated first. Leave empty for frontend dev.

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: allchat-frontend-postgres
    environment:
      POSTGRES_DB: allchat
      POSTGRES_USER: allchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - frontend_postgres_data:/var/lib/postgresql/data
      - ./migrations/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allchat"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - frontend-dev

  # Redis for pub/sub and streams
  redis:
    image: redis:7-alpine
    container_name: allchat-frontend-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        else
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - frontend_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - frontend-dev

  # Overlay Manager - CRUD operations
  overlay-manager:
    build:
      context: .
      dockerfile: services/overlay-manager/Dockerfile
    container_name: allchat-frontend-overlay
    environment:
      PORT: "8082"
      LOG_LEVEL: "debug"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: frontend-dev-secret-12345-padded-to-32b
      # Versioned key chain (shared/auth): services fatal without _V1 since the
      # JWT key-rotation migration
      JWT_SECRET_V1: frontend-dev-secret-12345-padded-to-32b
      SERVICE_JWT_SECRET_V1: frontend-dev-service-secret-padded-32b
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      MESSAGE_PROCESSOR_URL: http://message-processor:8087
      MESSAGE_PROCESSOR_API_KEY: dev-frontend-key
      # Phase 13 TTS — AES-GCM master key (32 bytes, base64 or hex). Match prod
      # docker-compose.yml fallback so `make frontend-dev` works without an .env.
      # Override for local key-rotation testing: TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      TOKEN_ENCRYPTION_KEY_V1: ${TOKEN_ENCRYPTION_KEY_V1:-0123456789abcdef0123456789abcdef}
      OVERLAY_PUBLIC_BASE_URL: ${OVERLAY_PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-dev
    restart: unless-stopped

  # Message Processor - Normalize and enrich messages
  message-processor:
    build:
      context: .
      dockerfile: services/message-processor/Dockerfile
    container_name: allchat-frontend-processor
    environment:
      PORT: "8087"
      LOG_LEVEL: "debug"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      EMOTE_SERVICE_URL: ""  # Disable emote enrichment for frontend testing
      MOCK_MESSAGE_API_KEY: dev-frontend-key
      MESSAGE_AGE_CUTOFF_SECONDS: "600"  # 10 minutes for testing
    ports:
      - "127.0.0.1:8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-dev
    restart: unless-stopped

  # Share Service - Share request management
  share-service:
    build:
      context: .
      dockerfile: services/share-service/Dockerfile
    container_name: allchat-frontend-share
    environment:
      PORT: "8090"
      LOG_LEVEL: "debug"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: frontend-dev-secret-12345-padded-to-32b
      # Versioned key chain (shared/auth): services fatal without _V1 since the
      # JWT key-rotation migration
      JWT_SECRET_V1: frontend-dev-secret-12345-padded-to-32b
      SERVICE_JWT_SECRET_V1: frontend-dev-service-secret-padded-32b
      API_GATEWAY_URL: http://api-gateway:8080
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-dev
    restart: unless-stopped

  # API Gateway - WebSocket and HTTP routing
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: allchat-frontend-gateway
    environment:
      PORT: "8080"
      LOG_LEVEL: "debug"
      AUTH_SERVICE_URL: ""  # Disable auth for frontend testing
      OVERLAY_SERVICE_URL: http://overlay-manager:8082
      EMOTE_SERVICE_URL: ""  # Disable emote service
      SHARE_SERVICE_URL: http://share-service:8090
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: allchat
      DATABASE_USER: allchat
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: frontend-dev-secret-12345-padded-to-32b
      # Versioned key chain (shared/auth): services fatal without _V1 since the
      # JWT key-rotation migration
      JWT_SECRET_V1: frontend-dev-secret-12345-padded-to-32b
      SERVICE_JWT_SECRET_V1: frontend-dev-service-secret-padded-32b
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      # Wildcard is rejected when AllowCredentials is on (H3 cookie auth)
      CORS_ORIGIN: "http://localhost:3000"
      WEBSOCKET_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      overlay-manager:
        condition: service_started
      message-processor:
        condition: service_started
    networks:
      - frontend-dev
    restart: unless-stopped

volumes:
  frontend_postgres_data:
    driver: local
  frontend_redis_data:
    driver: local

networks:
  frontend-dev:
    driver: bridge
